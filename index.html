<style>

* {

}

body {

button {

/* =========================================================
   LOGIN
========================================================= */

#authOverlay {
    position: fixed;
    inset: 0;
    background: #f3f4f6;
    display: flex;

    align-items: center;
    z-index: 9999;
}

.authBox {
    width: 100%;
    max-width: 420px;

.authBox h1 {

}

.authBox input {

}

.authBtn {
    width: 100%;

    border-radius: 8px;
    background: #2563eb;

    font-weight: bold;

}

.authSecondary {
    width: 100%;
    padding: 12px;
    border: 1px solid #2563eb;
    border-radius: 8px;

    font-weight: bold;

}

.authMessage {
    margin-top: 15px;

}

/* =========================================================
   APP
========================================================= */

#app {
    display: none;
}

header {
    background: #111827;
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;

}

header h1 {

.userPanel {
    display: flex;

}

.logoutBtn {

    border: 0;
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.card h2 {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field label {
    font-weight: bold;
    font-size: 14px;
}

.field input,
.field textarea {
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.field textarea {
    min-height: 80px;
    resize: vertical;
}

/* =========================================================
   MATERIALES
========================================================= */

.materiales {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.material {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    background: #fafafa;
}

.materialGrid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
}

.material input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.removeMaterial {
    background: #dc2626;
    color: white;
    border: 0;

    padding: 10px 12px;
}

.addMaterial {
    background: #16a34a;
    color: white;
    border: 0;

    padding: 11px 16px;
    margin-top: 10px;
}

/* =========================================================
   BOTONES
========================================================= */

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.primaryBtn {
    background: #2563eb;
    color: white;

    padding: 12px 18px;

    font-weight: bold;
}

.successBtn {

.whatsappBtn {

}

.dangerBtn {

    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
}

/* =========================================================
   PREVIEW
========================================================= */

#preview {
    background: white;
    padding: 30px;
    border-radius: 10px;
    min-height: 500px;
}

.previewHeader {
    display: flex;
    justify-content: space-between;

.previewTable {

}

.previewTable th,

    padding: 10px;
    text-align: left;
}

.previewTotal {

    font-size: 22px;

    margin-top: 20px;
}

.previewConditions {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

/* =========================================================
   BOTONES DENTRO DE VISTA PREVIA
========================================================= */

.previewActions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 30px;

    border-top: 2px solid #ddd;
}

.previewActions button {

}

/* =========================================================

.historyItem {

}

.historyInfo {

}

.historyActions {

/* =========================================================

#pdfModal {

.pdfModalBox {

/* =========================================================

@media (max-width: 700px) {

    }

    }

    }

    .previewHeader {

        gap: 15px;
    }

    .previewTable {
        font-size: 13px;
    }

    .previewActions {
        flex-direction: column;
    }

    .previewActions button {
        width: 100%;
    }

}

</style>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://tgqjjvmekfsliuagvsub.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ad4PSfBf0d1fcRHIrdDN5g_FlKG6PQU";

let supabaseClient = null;

let usuarioActual = null;

let materiales = [];

let presupuestoPDF = null;

let presupuestoSeleccionadoWhatsApp = null;

let presupuestosActuales = [];


/* =========================================================
   CONECTAR SUPABASE
========================================================= */

function conectarSupabase() {

    try {

        if (
            !window.supabase ||
            !window.supabase.createClient
        ) {

            console.error(
                "Supabase JS no está cargado."
            );

            return false;
        }

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        console.log(
            "Supabase conectado correctamente."
        );

        return true;

    } catch (error) {

        console.error(
            "Error conectando Supabase:",
            error
        );

        return false;
    }

}


/* =========================================================
   AUTH
========================================================= */

function mostrarRegistro() {

    document.getElementById("loginForm").style.display = "none";

    document.getElementById("registerForm").style.display = "block";

    document.getElementById("authMessage").textContent = "";

}


function mostrarLogin() {

    document.getElementById("registerForm").style.display = "none";

    document.getElementById("loginForm").style.display = "block";

    document.getElementById("authMessage").textContent = "";

}


/* =========================================================
   REGISTRAR
========================================================= */

async function registrarUsuario() {

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const mensaje =
        document.getElementById("authMessage");


    if (!email || !password) {

        mensaje.textContent =
            "Completá email y contraseña.";

        return;
    }


    if (password.length < 6) {

        mensaje.textContent =
            "La contraseña debe tener al menos 6 caracteres.";

        return;
    }


    mensaje.textContent =
        "Creando cuenta...";


    const redirectURL =
        window.location.origin +
        window.location.pathname;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({

                email,
                password,

                options: {

                    emailRedirectTo:
                        redirectURL

                }

            });


        if (error) {

            console.error(
                "Error registrando usuario:",
                error
            );

            mensaje.textContent =
                error.message;

            return;
        }


        console.log(
            "Usuario registrado:",
            data
        );


        mensaje.textContent =
            "Cuenta creada. Revisá tu correo para confirmar la cuenta.";


    } catch (error) {

        console.error(
            "Error inesperado:",
            error
        );

        mensaje.textContent =
            "Ocurrió un error al crear la cuenta.";

    }

}


/* =========================================================
   INICIAR SESIÓN
========================================================= */

async function iniciarSesion() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const mensaje =
        document.getElementById("authMessage");


    if (!email || !password) {

        mensaje.textContent =
            "Completá email y contraseña.";

        return;
    }


    mensaje.textContent =
        "Iniciando sesión...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email,

                password

            });


        if (error) {

            console.error(error);

            mensaje.textContent =
                error.message;

            return;
        }


        usuarioActual =
            data.user;

        mostrarApp();


    } catch (error) {

        console.error(error);

        mensaje.textContent =
            "Ocurrió un error al iniciar sesión.";

    }

}


/* =========================================================
   CERRAR SESIÓN
========================================================= */

async function cerrarSesion() {

    if (supabaseClient) {

        await supabaseClient.auth.signOut();

    }

    usuarioActual = null;

    presupuestosActuales = [];

    document.getElementById("app").style.display = "none";

    document.getElementById("authOverlay").style.display = "flex";

}


/* =========================================================
   MOSTRAR APP
========================================================= */

function mostrarApp() {

    if (!usuarioActual) {
        return;
    }


    document.getElementById("authOverlay").style.display = "none";

    document.getElementById("app").style.display = "block";


    document.getElementById("usuarioEmail").textContent =
        usuarioActual.email || "";


    cargarDatosNegocio();


    establecerFechaActual();


    if (materiales.length === 0) {

        agregarMaterial();

    }


    mostrarPresupuestos();

    actualizarPreview();

}


/* =========================================================
   SESIÓN ACTUAL
========================================================= */

async function comprobarSesion() {

    if (!supabaseClient) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Error obteniendo sesión:",
            error
        );

        return;
    }


    if (
        data &&
        data.session &&
        data.session.user
    ) {

        usuarioActual =
            data.session.user;

        mostrarApp();

    } else {

        usuarioActual = null;

        document.getElementById("authOverlay").style.display = "flex";

        document.getElementById("app").style.display = "none";

    }

}


/* =========================================================
   FECHA ACTUAL
========================================================= */

function establecerFechaActual() {

    const campoFecha =
        document.getElementById("fecha");


    if (!campoFecha) {
        return;
    }


    if (campoFecha.value) {
        return;
    }


    const hoy =
        new Date();


    const año =
        hoy.getFullYear();


    const mes =
        String(
            hoy.getMonth() + 1
        ).padStart(2, "0");


    const dia =
        String(
            hoy.getDate()
        ).padStart(2, "0");


    campoFecha.value =
        `${año}-${mes}-${dia}`;

}


/* =========================================================
   DATOS NEGOCIO
========================================================= */

function cargarDatosNegocio() {

    const campos = [
        "negocio",
        "negocioTelefono",
        "negocioEmail",
        "negocioDireccion",
        "negocioCuit"
    ];


    campos.forEach(
        campo => {

            const elemento =
                document.getElementById(campo);


            const valor =
                localStorage.getItem(
                    "presufacil_" + campo
                );


            if (valor !== null) {

                elemento.value = valor;

            }


            if (!elemento.dataset.listenerAgregado) {

                elemento.addEventListener(
                    "input",
                    guardarDatosNegocio
                );

                elemento.dataset.listenerAgregado =
                    "true";

            }

        }
    );

}


function guardarDatosNegocio() {

    const campos = [
        "negocio",
        "negocioTelefono",
        "negocioEmail",
        "negocioDireccion",
        "negocioCuit"
    ];


    campos.forEach(
        campo => {

            localStorage.setItem(
                "presufacil_" + campo,
                document.getElementById(campo).value
            );

        }
    );

}


/* =========================================================
   MATERIALES
========================================================= */

function agregarMaterial(
    nombre = "",
    cantidad = 1,
    precio = 0
) {

    const id =
        Date.now() +
        Math.random();


    materiales.push({

        id,
        nombre,
        cantidad,
        precio

    });


    renderMateriales();

    actualizarPreview();

}


function eliminarMaterial(id) {

    materiales =
        materiales.filter(
            material =>
                material.id !== id
        );


    renderMateriales();

    actualizarPreview();

}


function actualizarMaterial(
    id,
    campo,
    valor
) {

    const material =
        materiales.find(
            item =>
                item.id === id
        );


    if (!material) {
        return;
    }


    if (
        campo === "cantidad" ||
        campo === "precio"
    ) {

        material[campo] =
            parseFloat(valor) || 0;

    } else {

        material[campo] =
            valor;

    }


    actualizarPreview();

}


function renderMateriales() {

    const contenedor =
        document.getElementById("materiales");


    contenedor.innerHTML = "";


    materiales.forEach(
        material => {

            const div =
                document.createElement("div");


            div.className =
                "material";


            div.innerHTML = `

                <div class="materialGrid">

                    <div class="field">

                        <label>Material</label>

                        <input
                            type="text"
                            value="${escapeHTML(material.nombre)}"
                            oninput="actualizarMaterial(${material.id}, 'nombre', this.value)"
                        >

                    </div>

                    <div class="field">

                        <label>Cantidad</label>

                        <input
                            type="number"
                            min="0"
                            step="0.01"
                            value="${material.cantidad}"
                            oninput="actualizarMaterial(${material.id}, 'cantidad', this.value)"
                        >

                    </div>

                    <div class="field">

                        <label>Precio</label>

                        <input
                            type="number"
                            min="0"
                            step="0.01"
                            value="${material.precio}"
                            oninput="actualizarMaterial(${material.id}, 'precio', this.value)"
                        >

                    </div>

                    <button
                        class="removeMaterial"
                        onclick="eliminarMaterial(${material.id})"
                    >
                        Eliminar
                    </button>

                </div>

            `;


            contenedor.appendChild(div);

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   TOTAL
========================================================= */

function calcularTotal() {

    let totalMateriales = 0;


    materiales.forEach(
        material => {

            totalMateriales +=
                (
                    parseFloat(material.cantidad) || 0
                ) *
                (
                    parseFloat(material.precio) || 0
                );

        }
    );


    const manoObra =
        parseFloat(
            document.getElementById("manoObra").value
        ) || 0;


    return totalMateriales + manoObra;

}

/* =========================================================
   FORMATEAR FECHA
========================================================= */

function formatearFecha(fecha) {

    if (!fecha) {
        return "";
    }


    const partes =
        fecha.split("-");


    if (partes.length !== 3) {
        return fecha;
    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


/* =========================================================
   FORMATO NÚMEROS
========================================================= */

function formatearNumero(numero) {

    return Number(numero || 0).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


/* =========================================================
   GUARDAR PRESUPUESTO
========================================================= */

async function guardarPresupuesto() {

    if (!usuarioActual) {

        alert(
            "Primero iniciá sesión."
        );

        return;
    }


    establecerFechaActual();


    const negocio =
        document.getElementById("negocio").value.trim();

    const trabajo =
        document.getElementById("trabajo").value.trim();

    const cliente =
        document.getElementById("cliente").value.trim();

    const total =
        calcularTotal();


    const numero =
        "PF-" + Date.now();


    const datos = {

        negocio,

        negocioTelefono:
            document.getElementById("negocioTelefono").value,

        negocioEmail:
            document.getElementById("negocioEmail").value,

        negocioDireccion:
            document.getElementById("negocioDireccion").value,

        negocioCuit:
            document.getElementById("negocioCuit").value,

        cliente,

        telefono:
            document.getElementById("telefono").value,

        trabajo,

        fecha:
            document.getElementById("fecha").value,

        materiales,

        manoObra:
            parseFloat(
                document.getElementById("manoObra").value
            ) || 0,

        condiciones:
            document.getElementById("condiciones").value

    };


    const registro = {

        user_id:
            usuarioActual.id,

        numero:
            numero,

        negocio,

        trabajo,

        cliente,

        total,

        datos

    };


    console.log(
        "Guardando presupuesto:",
        registro
    );


    const {
        error
    } =
        await supabaseClient
            .from("presupuestos")
            .insert([registro]);


    if (error) {

        console.error(
            "Error Supabase:",
            error
        );

        alert(
            "Error al guardar: " +
            error.message
        );

        return;
    }


    alert(
        "Presupuesto guardado correctamente."
    );


    await mostrarPresupuestos();

}


/* =========================================================
   MOSTRAR PRESUPUESTOS
========================================================= */

async function mostrarPresupuestos() {

    const contenedor =
        document.getElementById("historial");


    if (!supabaseClient) {
        return;
    }


    if (!usuarioActual) {

        contenedor.innerHTML =
            "<p>Iniciá sesión para ver tus presupuestos.</p>";

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("presupuestos")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Error cargando historial:",
            error
        );

        contenedor.innerHTML =
            "<p>No se pudo cargar el historial.</p>";

        return;
    }


    presupuestosActuales =
        data || [];


    if (!data || data.length === 0) {

        contenedor.innerHTML =
            "<p>No hay presupuestos guardados.</p>";

        return;
    }


    contenedor.innerHTML = "";


    data.forEach(
        presupuesto => {

            const div =
                document.createElement("div");


            div.className =
                "historyItem";


            const fechaHistorial =
                presupuesto.datos &&
                presupuesto.datos.fecha
                ?
                formatearFecha(
                    presupuesto.datos.fecha
                )
                :
                "";


            div.innerHTML = `

                <div class="historyInfo">

                    <div>

                        <strong>
                            ${escapeHTML(
                                String(
                                    presupuesto.numero || ""
                                )
                            )}
                        </strong>

                        <br>

                        Cliente:
                        ${escapeHTML(
                            presupuesto.cliente || "-"
                        )}

                        <br>

                        Trabajo:
                        ${escapeHTML(
                            presupuesto.trabajo || "-"
                        )}

                        ${
                            fechaHistorial
                            ?
                            `<br>Fecha: ${escapeHTML(fechaHistorial)}`
                            :
                            ""
                        }

                    </div>

                    <div>

                        <strong>
                            $ ${formatearNumero(
                                presupuesto.total
                            )}
                        </strong>

                    </div>

                </div>


                <div class="historyActions">

                    <button
                        class="smallBtn viewBtn"
                        onclick="cargarPresupuestoDesdeHistorial(${Number(presupuesto.id)})"
                    >
                        Ver
                    </button>


                    <button
                        class="smallBtn historyWhatsapp"
                        onclick="enviarPresupuestoDesdeHistorial(${Number(presupuesto.id)})"
                    >
                        WhatsApp
                    </button>


                    <button
                        class="smallBtn deleteBtn"
                        onclick="eliminarPresupuesto(${Number(presupuesto.id)})"
                    >
                        Eliminar
                    </button>

                </div>

            `;


            contenedor.appendChild(div);

        }
    );

}


/* =========================================================
   OBTENER PRESUPUESTO
========================================================= */

function obtenerPresupuestoPorId(id) {

    return presupuestosActuales.find(
        presupuesto =>
            String(presupuesto.id) === String(id)
    );

}


/* =========================================================
   CARGAR DESDE HISTORIAL
========================================================= */

function cargarPresupuestoDesdeHistorial(id) {

    const presupuesto =
        obtenerPresupuestoPorId(id);


    if (!presupuesto) {

        alert(
            "No se encontró el presupuesto."
        );

        return;
    }


    cargarPresupuestoSupabase(
        presupuesto,

    );

}


/* =========================================================
   WHATSAPP DESDE HISTORIAL
========================================================= */

async function enviarPresupuestoDesdeHistorial(id) {

    const presupuesto =
        obtenerPresupuestoPorId(id);


    if (!presupuesto) {

            "No se encontró el presupuesto."

        return;

/* =========================================================
   CARGAR PRESUPUESTO
========================================================= */

function cargarPresupuestoSupabase(
    presupuesto,
    desplazar = true
) {

    const datos =
        presupuesto.datos || {};


    document.getElementById("negocio").value =
        datos.negocio ||
        presupuesto.negocio ||
        "";


    document.getElementById("negocioTelefono").value =
        datos.negocioTelefono ||
        "";


    document.getElementById("negocioEmail").value =
        datos.negocioEmail ||
        "";


    document.getElementById("negocioDireccion").value =
        datos.negocioDireccion ||
        "";


    document.getElementById("negocioCuit").value =
        datos.negocioCuit ||
        "";


    document.getElementById("cliente").value =
        datos.cliente ||
        presupuesto.cliente ||
        "";


    document.getElementById("telefono").value =
        datos.telefono ||
        "";


    document.getElementById("trabajo").value =
        datos.trabajo ||
        presupuesto.trabajo ||
        "";


    document.getElementById("fecha").value =
        datos.fecha ||
        "";


    document.getElementById("manoObra").value =
        datos.manoObra || 0;


    document.getElementById("condiciones").value =
        datos.condiciones ||
        "";


    materiales =
        Array.isArray(datos.materiales)
        ?
        datos.materiales
        :
        [];


    renderMateriales();

    actualizarPreview();


    if (desplazar) {

        document.getElementById("preview").scrollIntoView({
            behavior: "smooth"
        });

    }

}


/* =========================================================
   ELIMINAR
========================================================= */

async function eliminarPresupuesto(id) {

    if (
        !confirm(
            "¿Eliminar este presupuesto?"
        )
    ) {

        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("presupuestos")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(
            "Error eliminando:",

        );

        alert(
            "Error al eliminar: " +

        );

}


/* =========================================================
   GENERAR PDF
========================================================= */

async function generarPDF() {

    actualizarPreview();


    const elemento =
        document.getElementById("preview");


    const acciones =
        elemento.querySelector(".previewActions");


    if (acciones) {

        acciones.style.display =
            "none";

    }


    try {

        const canvas =
            await html2canvas(
                elemento,
                {

                    scale: 1.5,

                    useCORS: true,

                    backgroundColor:
                        "#ffffff",

                    logging:
                        false

                }
            );


        const imgData =
            canvas.toDataURL(
                "image/jpeg",
                0.75
            );


        const {
            jsPDF
        } =
            window.jspdf;


        const pdf =
            new jsPDF({

                orientation:
                    "portrait",

                unit:
                    "mm",

                format:
                    "a4",

                compress:
                    true

            });


        const pageWidth =
            pdf.internal.pageSize.getWidth();

        const pageHeight =
            pdf.internal.pageSize.getHeight();


        const ratio =
            Math.min(
                pageWidth / canvas.width,
                pageHeight / canvas.height
            );


        const imgWidth =
            canvas.width * ratio;


        const imgHeight =
            canvas.height * ratio;


        const x =
            (
                pageWidth -
                imgWidth
            ) / 2;


        const y = 5;


        pdf.addImage(
            imgData,
            "JPEG",
            x,
            y,
            imgWidth,
            imgHeight
        );


        presupuestoPDF =
            pdf;


        console.log(
            "PDF generado:",
            Math.round(
                pdf.output("blob").size / 1024
            ),
            "KB"
        );


    } finally {

        if (acciones) {

            acciones.style.display =
                "";

        }

    }


    document.getElementById("pdfModal").style.display =
        "flex";

}

   DESCARGAR PDF
========================================================= */

function descargarPDF() {

    if (!presupuestoPDF) {

        alert(
            "Primero generá el PDF."
        );

        return;
    }


    presupuestoPDF.save(
        "presupuesto.pdf"
    );

}

}


/* =========================================================
   NORMALIZAR TELÉFONO ARGENTINO
========================================================= */

function normalizarTelefonoWhatsApp(telefono) {

    if (!telefono) {
        return "";
    }


    let numero =
        String(telefono).replace(/\D/g, "");


    if (!numero) {
        return "";
    }


    if (numero.startsWith("54")) {

        numero =
            numero.substring(2);

    }


    if (numero.startsWith("0")) {

        numero =
            numero.substring(1);

    }


    if (numero.length === 12) {

        if (
            numero.substring(2, 4) === "15"
        ) {

            numero =
                numero.substring(0, 2) +
                numero.substring(4);

        } else if (
            numero.substring(3, 5) === "15"
        ) {

            numero =
                numero.substring(0, 3) +
                numero.substring(5);

        } else if (
            numero.substring(4, 6) === "15"
        ) {

            numero =
                numero.substring(0, 4) +
                numero.substring(6);

        }

    }


    if (numero.length === 10) {

        return "549" + numero;

    }


    return "54" + numero;

}


/* =========================================================
   OBTENER MENSAJE WHATSAPP
========================================================= */

function obtenerMensajeWhatsApp() {

    const cliente =
        document.getElementById("cliente").value.trim();


    const total =
        calcularTotal();


    if (cliente) {

        return (
            `Hola ${cliente}, te envío el presupuesto. ` +
            `Total: $ ${formatearNumero(total)}`
        );

    }


    return (
        `Hola, te envío el presupuesto. ` +
        `Total: $ ${formatearNumero(total)}`
    );

}


/* =========================================================
   WHATSAPP
========================================================= */

async function enviarWhatsApp() {

    const telefono =
        document.getElementById("telefono").value.trim();


    if (!telefono) {

        alert(
            "Ingresá el teléfono del cliente antes de compartir."
        );

        return;
    }


    const numeroWhatsApp =
        normalizarTelefonoWhatsApp(
            telefono
        );


    if (!numeroWhatsApp) {

        alert(
            "El número de teléfono no es válido."
        );

        return;
    }


    presupuestoSeleccionadoWhatsApp = {

        telefono: telefono

    };


    await generarPDF();

}


/* =========================================================
   WHATSAPP PRESUPUESTO GUARDADO
========================================================= */

async function enviarPresupuestoGuardadoSupabase(
    presupuesto
) {

    const datos =
        presupuesto.datos || {};


    const telefono =
        datos.telefono ||
        "";


    if (!telefono) {

        alert(
            "Este presupuesto no tiene teléfono de cliente."
        );

        return;
    }


    const numeroWhatsApp =
        normalizarTelefonoWhatsApp(
            telefono
        );


    if (!numeroWhatsApp) {

        alert(
            "El número de teléfono no es válido."
        );

        return;
    }


    cargarPresupuestoSupabase(
        presupuesto,
        false
    );


    presupuestoSeleccionadoWhatsApp = {

        telefono: telefono

    };


    await generarPDF();

}


/* =========================================================
   COMPARTIR PDF WHATSAPP
========================================================= */

async function compartirPDFWhatsApp() {

    if (!presupuestoPDF) {

        alert(
            "Primero generá el PDF."
        );

        return;
    }


    const telefono =
        presupuestoSeleccionadoWhatsApp &&
        presupuestoSeleccionadoWhatsApp.telefono
        ?
        presupuestoSeleccionadoWhatsApp.telefono
        :
        document.getElementById("telefono").value.trim();


    if (!telefono) {

        alert(
            "Ingresá el teléfono del cliente."
        );

        return;
    }


    const numeroWhatsApp =
        normalizarTelefonoWhatsApp(
            telefono
        );


    if (!numeroWhatsApp) {

        alert(
            "El número de teléfono no es válido."
        );

        return;
    }


    const mensaje =
        obtenerMensajeWhatsApp();


    const blob =
        presupuestoPDF.output("blob");


    const archivo =
        new File(
            [blob],
            "presupuesto.pdf",
            {
                type: "application/pdf"
            }
        );


    if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
            files: [archivo]
        })
    ) {

        try {

            await navigator.share({

                files: [archivo],

                title: "Presupuesto",

                text: mensaje

            });


            cerrarPDFModal();

            return;

        } catch (error) {

            if (
                error &&
                error.name === "AbortError"
            ) {

                return;

            }


            console.log(
                "No se pudo compartir el archivo:",
                error
            );

        }

    }


    presupuestoPDF.save(
        "presupuesto.pdf"
    );


    const urlWhatsApp =
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        encodeURIComponent(mensaje);


    window.open(
        urlWhatsApp,
        "_blank"
    );


    cerrarPDFModal();

}

}

}
